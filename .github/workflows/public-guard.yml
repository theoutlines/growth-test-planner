# This repo is public: nothing private may land in it (history included).
name: Public guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/public_guard.py
      - name: Code stays small and clean (tools/structure/check.py)
        run: python3 tools/structure/check.py --strict
